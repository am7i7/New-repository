<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حنتوشي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: sticky header with language switch, compact hero, offers strip, filterable catalog, order form that builds a WhatsApp message, bottom cart bar. */
:root{
  --bg:#FBF7F6; --surface:#FFFFFF; --fg:#241615; --muted:#6E5A58; --line:#EBDCDA;
  --brand:#C62828; --brand-fg:#FFFFFF; --accent:#F0B429; --accent-fg:#2A2008; --tint:#FBEAE8; --sale:#C62828;
  --font:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1010; --surface:#251817; --fg:#F5E9E8; --muted:#BDA3A0; --line:#3B2826;
    --brand:#D93A40; --brand-fg:#FFFFFF; --tint:#2E1D1C; --sale:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1010; --surface:#251817; --fg:#F5E9E8; --muted:#BDA3A0; --line:#3B2826;
  --brand:#D93A40; --brand-fg:#FFFFFF; --tint:#2E1D1C; --sale:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 84px;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.5rem;color:var(--brand);text-decoration:none}
.logo i{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-fg);font-style:normal;font-size:1.25rem}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:8px 16px;cursor:pointer;font-weight:500;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg)}

.hero{padding-block:36px 28px;display:grid;gap:14px;max-width:46rem}
.hero h1{margin:0;font-size:clamp(2rem,6vw,3.1rem);line-height:1.15;font-weight:800;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:1.1rem;max-width:36rem}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--brand);color:var(--brand-fg)}
.btn.alt{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

section{padding-block:26px}
h2{margin:0 0 14px;font-size:1.5rem;font-weight:800}
.sub{color:var(--muted);margin:-8px 0 16px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.pic{height:104px;overflow:hidden;border-radius:10px;background:var(--tint);display:grid;place-items:center;font-size:2.6rem}
.pic.photo{background:#fff}.pic img{max-width:100%;max-height:100%;object-fit:contain}
.badge{position:absolute;top:18px;inset-inline-start:18px;background:var(--accent);color:var(--accent-fg);font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px}
.card h3{margin:0;font-size:1rem;font-weight:700;line-height:1.3}
.unit{color:var(--muted);font-size:.85rem}
.price{display:flex;align-items:baseline;gap:8px;margin-top:auto;font-weight:800;font-size:1.15rem}
.price s{color:var(--muted);font-weight:400;font-size:.9rem}
.add{border:0;background:var(--brand);color:var(--brand-fg);border-radius:10px;padding:8px;font-weight:700;cursor:pointer}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--tint);border-radius:10px;padding:2px}
.step button{width:38px;height:36px;border:0;border-radius:8px;background:var(--brand);color:var(--brand-fg);font-size:1.2rem;font-weight:700;cursor:pointer}
.step b{min-width:2ch;text-align:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px}
.lines{display:grid;gap:10px}
.line{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.line .step{min-width:112px}
.line span.t{min-width:0;overflow-wrap:anywhere}
.total{display:flex;justify-content:space-between;font-size:1.25rem;font-weight:800}
.empty{color:var(--muted);text-align:center;padding:14px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:grid;gap:4px;font-weight:500;font-size:.95rem;min-width:0}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
.mode{display:flex;gap:8px;flex-wrap:wrap}
.mode label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--bg)}
.mode input{accent-color:var(--brand)}
.note{color:var(--muted);font-size:.9rem;margin:0}

.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.info .panel{gap:6px}
.info h3{margin:0;font-size:1.05rem}
.info p{margin:0;color:var(--muted)}
footer{padding-block:24px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}

.cartbar{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--brand);color:var(--brand-fg);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;font-weight:700}
.cartbar[hidden]{display:none!important}
.cartbar .go{background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:8px 16px}
@media (prefers-reduced-motion:no-preference){.card,.btn,.add{transition:transform .12s}.card:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="#top"><i>ح</i><span data-i="brand"></span></a>
    <div class="lang" role="group" aria-label="Language / שפה / اللغة">
      <button type="button" data-lang="ar" aria-pressed="true">العربية</button>
      <button type="button" data-lang="he" aria-pressed="false">עברית</button>
    </div>
  </div>
</header>

<main class="wrap" id="top">
  <div class="hero">
    <h1 data-i="h1"></h1>
    <p data-i="lead"></p>
    <div class="cta">
      <a class="btn" href="#catalog" data-i="ctaShop"></a>
      <a class="btn alt" href="#offers" data-i="ctaOffers"></a>
    </div>
  </div>

  <section id="offers">
    <h2 data-i="offers"></h2>
    <p class="sub" data-i="offersSub"></p>
    <div class="grid" id="offerGrid"></div>
  </section>

  <section id="catalog">
    <h2 data-i="catalog"></h2>
    <div class="chips" id="chips" role="group"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="order">
    <h2 data-i="order"></h2>
    <div class="panel">
      <div class="lines" id="lines"></div>
      <div class="total" id="totalRow" hidden><span data-i="total"></span><span class="num" id="total"></span></div>
      <div class="mode" role="radiogroup">
        <label><input type="radio" name="mode" value="delivery" checked><span data-i="delivery"></span></label>
        <label><input type="radio" name="mode" value="pickup"><span data-i="pickup"></span></label>
      </div>
      <div class="fields">
        <label><span data-i="name"></span><input type="text" id="cname" autocomplete="name"></label>
        <label id="addrWrap"><span data-i="address"></span><input type="text" id="caddr" autocomplete="street-address"></label>
      </div>
      <label><span data-i="notes"></span><textarea id="cnotes"></textarea></label>
      <a class="btn" id="send" href="#order" target="_blank" rel="noopener" aria-disabled="true" data-i="send"></a>
      <p class="note" data-i="sendNote"></p>
    </div>
  </section>

  <section id="info">
    <h2 data-i="visit"></h2>
    <div class="info">
      <div class="panel"><h3 data-i="hoursT"></h3><p data-i="hours1"></p><p data-i="hours2"></p></div>
      <div class="panel"><h3 data-i="whyT"></h3><p data-i="why"></p></div>
    </div>
  </section>
</main>

<footer><div class="wrap"><span data-i="brand"></span> · <span data-i="foot"></span></div></footer>

<a class="cartbar" href="#order" id="cartbar" hidden>
  <span><span id="cbCount" class="num"></span> <span data-i="items"></span> · <span id="cbTotal" class="num"></span></span>
  <span class="go" data-i="viewCart"></span>
</a>

var lang = "ar", cat = "all", cart = {}, lastFocus = null;
var $ = function(id){return document.getElementById(id)};
function money(n){return "₪" + n.toFixed(2).replace(/\.00$/,"")}
function find(id){return P.filter(function(x){return x.id===id})[0]}
function cartLines(){return Object.keys(cart).filter(function(k){return cart[k]>0}).map(function(k){return {p:find(k),q:cart[k]}})}
function cartTotal(){return cartLines().reduce(function(s,l){return s+l.p.p*l.q},0)}

function cardHTML(x, inOffers){
  var t = T[lang], q = cart[x.id]||0;
  var ctl = q>0
    ? '<div class="step"><button type="button" data-act="dec" data-id="'+x.id+'" aria-label="−">−</button><b class="num">'+q+'</b><button type="button" data-act="inc" data-id="'+x.id+'" aria-label="+">+</button></div>'
    : '<button type="button" class="add" data-act="inc" data-id="'+x.id+'">'+t.add+'</button>';
  return '<div class="card">'+(x.old?'<span class="badge">'+t.sale+'</span>':'')+
    (IMG[x.id]?'<div class="pic photo"><img src="'+IMG[x.id]+'" alt=""></div>':'<div class="pic" aria-hidden="true">'+x.e+'</div>')+'<h3>'+x[lang]+'</h3><div class="unit">'+(lang==="ar"?x.ua:x.uh)+'</div>'+
    '<div class="price"><span class="num">'+money(x.p)+'</span>'+(x.old?'<s class="num">'+money(x.old)+'</s>':'')+'</div>'+ctl+'</div>';
}
function render(){
  var t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = "rtl";
  document.title = t.brand;
  document.querySelectorAll("[data-i]").forEach(function(n){n.textContent = t[n.getAttribute("data-i")]});
  document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed", String(b.getAttribute("data-lang")===lang))});
  $("chips").innerHTML = [{id:"all",ar:t.all,he:t.all}].concat(CATS).map(function(c){
    return '<button type="button" class="chip" data-cat="'+c.id+'" aria-pressed="'+(cat===c.id)+'">'+c[lang]+'</button>'}).join("");
  $("offerGrid").innerHTML = P.filter(function(x){return x.old}).map(cardHTML).join("");
  $("grid").innerHTML = P.filter(function(x){return cat==="all"||x.c===cat}).map(cardHTML).join("");
  renderCart();
  if(lastFocus){var el=document.querySelector(lastFocus); if(el) el.focus(); lastFocus=null;}
}
function renderCart(){
  var t = T[lang], ls = cartLines(), tot = cartTotal(), count = ls.reduce(function(s,l){return s+l.q},0);
  $("lines").innerHTML = ls.length ? ls.map(function(l){
    return '<div class="line"><span class="t">'+l.p[lang]+' <span class="unit">· '+(lang==="ar"?l.p.ua:l.p.uh)+'</span></span>'+
      '<span class="step"><button type="button" data-act="dec" data-id="'+l.p.id+'" aria-label="−">−</button><b class="num">'+l.q+'</b><button type="button" data-act="inc" data-id="'+l.p.id+'" aria-label="+">+</button></span>'+
      '<b class="num">'+money(l.p.p*l.q)+'</b></div>'}).join("") : '<div class="empty">'+t.empty+'</div>';
  $("totalRow").hidden = !ls.length; $("total").textContent = money(tot);
  $("cartbar").hidden = !ls.length; $("cbCount").textContent = count; $("cbTotal").textContent = money(tot);
  var mode = document.querySelector("input[name=mode]:checked").value;
  $("addrWrap").hidden = mode!=="delivery";
  var msg = t.msgHead+"\n\n"+ls.map(function(l){return "• "+l.p[lang]+" ("+(lang==="ar"?l.p.ua:l.p.uh)+") × "+l.q+" = "+money(l.p.p*l.q)}).join("\n")+
    "\n\n"+t.msgTotal+": "+money(tot)+"\n"+t.msgMode+": "+(mode==="delivery"?t.delivery:t.pickup);
  if($("cname").value.trim()) msg += "\n"+t.msgName+": "+$("cname").value.trim();
  if(mode==="delivery" && $("caddr").value.trim()) msg += "\n"+t.msgAddr+": "+$("caddr").value.trim();
  if($("cnotes").value.trim()) msg += "\n"+t.msgNotes+": "+$("cnotes").value.trim();
  var a = $("send");
  a.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg);
  a.setAttribute("aria-disabled", String(!ls.length));
}
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if(b){
    var id = b.getAttribute("data-id"), act = b.getAttribute("data-act");
    cart[id] = Math.max(0,(cart[id]||0)+(act==="inc"?1:-1));
    lastFocus = '[data-act="'+(cart[id]?act:"inc")+'"][data-id="'+id+'"]';
    render(); return;
  }
  var c = e.target.closest("[data-cat]");
  if(c){cat = c.getAttribute("data-cat"); render(); return;}
  var l = e.target.closest("[data-lang]");
  if(l){lang = l.getAttribute("data-lang"); try{localStorage.setItem("hlang",lang)}catch(_){} render();}
});
["cname","caddr","cnotes"].forEach(function(id){$(id).addEventListener("input", renderCart)});
document.querySelectorAll("input[name=mode]").forEach(function(r){r.addEventListener("change", renderCart)});
try{var s = localStorage.getItem("hlang"); if(s==="ar"||s==="he") lang = s;}catch(_){}
render();
</script>
